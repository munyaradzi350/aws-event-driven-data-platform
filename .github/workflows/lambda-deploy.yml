name: Deploy AWS Lambda

on:
  push:
    branches:
      - main
      - "feature/**"
    paths:
      - "scripts/lambda/**"

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    env:
      AWS_REGION: us-east-1

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 1: Create versioned artifact name
      - name: Set artifact name
        run: echo "ARTIFACT_NAME=lambda-${GITHUB_SHA}.zip" >> $GITHUB_ENV

      # Step 2: Zip Lambda package
      - name: Zip Lambda function
        run: |
          cd scripts/lambda
          zip -r $ARTIFACT_NAME .
          mv $ARTIFACT_NAME ../../

      # Step 3: Authenticate using GitHub OIDC
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::694322569546:role/GitHubActionRole
          aws-region: ${{ env.AWS_REGION }}

      # Step 4: Load deployment configuration from SSM
      - name: Load deployment configuration from SSM
        run: |
          echo "FUNCTION_NAME=$(aws ssm get-parameter \
            --name /event-driven/dev/lambda/function-name \
            --query Parameter.Value \
            --output text)" >> $GITHUB_ENV

          echo "S3_BUCKET=$(aws ssm get-parameter \
            --name /event-driven/dev/lambda/artifacts-bucket \
            --query Parameter.Value \
            --output text)" >> $GITHUB_ENV

      # Optional debugging
      - name: Verify loaded configuration
        run: |
          echo "Function Name: $FUNCTION_NAME"
          echo "Artifacts Bucket: $S3_BUCKET"

      # Step 5: Upload artifact to S3
      - name: Upload Lambda artifact
        run: |
          aws s3 cp $ARTIFACT_NAME s3://$S3_BUCKET/$ARTIFACT_NAME

      # Step 6: Update Lambda code
      - name: Update Lambda code
        run: |
          aws lambda update-function-code \
            --function-name $FUNCTION_NAME \
            --s3-bucket $S3_BUCKET \
            --s3-key $ARTIFACT_NAME

      # Step 7: Publish Lambda version
      - name: Publish Lambda version
        run: |
          VERSION=$(aws lambda publish-version \
            --function-name $FUNCTION_NAME \
            --query 'Version' \
            --output text)

          echo "VERSION=$VERSION" >> $GITHUB_ENV

      # Step 8: Move alias to latest version
      - name: Update Lambda alias
        run: |
          aws lambda update-alias \
            --function-name $FUNCTION_NAME \
            --name prod \
            --function-version $VERSION || \
          aws lambda create-alias \
            --function-name $FUNCTION_NAME \
            --name prod \
            --function-version $VERSION